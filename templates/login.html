<!DOCTYPE html>
<html><head><title>Login — ECMS</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head>
<body class="login-bg"><div class="login-container"><div class="login-box">
<h2>⚡ ECMS Login</h2>
{% with msgs = get_flashed_messages() %}{% if msgs %}
  {% for m in msgs %}<p class="error">{{ m }}</p>{% endfor %}
{% endif %}{% endwith %}
<form method="POST">
  <input type="text" name="username" placeholder="Username" required>
  <input type="password" name="password" placeholder="Password" required>
  <button type="submit">Login</button>
</form>
<p style="margin-top:14px;font-size:13px">
  Demo: admin/admin123 · elec/123 · client/123
</p>
<a href="/register">New here? Create an account</a>
</div></div></body></html>
