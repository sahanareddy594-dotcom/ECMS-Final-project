<!DOCTYPE html>
<html><head><title>Register — ECMS</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head>
<body class="login-bg"><div class="login-container"><div class="login-box">
<h2>Create Account</h2>
{% with msgs = get_flashed_messages() %}{% if msgs %}
  {% for m in msgs %}<p class="error">{{ m }}</p>{% endfor %}
{% endif %}{% endwith %}
<form method="POST">
  <input type="text" name="name" placeholder="Full Name" required>
  <input type="text" name="phone" placeholder="Phone">
  <input type="email" name="email" placeholder="Email" required>
  <input type="text" name="username" placeholder="Username" required>
  <input type="password" name="password" placeholder="Password" required>
  <select name="role" required>
    <option value="">-- Select Role --</option>
    <option value="client">Client</option>
    <option value="electrician">Electrician</option>
    <option value="admin">Admin</option>
  </select>
  <button type="submit">Register</button>
</form>
<a href="/login">Already have an account? Login</a>
</div></div></body></html>
